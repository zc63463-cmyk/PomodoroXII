name: Backend CI

on:
  workflow_dispatch:
  push:
    branches: [main, master, develop]
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  WORKING_DIR: backend

jobs:
  test:
    name: Backend tests and evidence
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      POMODOROXII_CI_RUN_ROOT: ${{ github.workspace }}/.ci-artifacts/${{ github.run_id }}-${{ github.run_attempt }}
      POMODOROXII_CI_RESULTS_DIR: ${{ github.workspace }}/.ci-artifacts/${{ github.run_id }}-${{ github.run_attempt }}/results
      POMODOROXII_TEST_ARTIFACTS_ROOT: ${{ github.workspace }}/.ci-artifacts/${{ github.run_id }}-${{ github.run_attempt }}/pomodoroxii-test-artifacts
      POMODOROXII_STRUCTURED_LOG_PATH: ${{ github.workspace }}/.ci-artifacts/${{ github.run_id }}-${{ github.run_attempt }}/results/backend.jsonl
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Sync locked dependencies
        run: uv sync --frozen --extra dev

      - name: Lint backend
        run: uv run ruff check app tests scripts

      - name: Prepare run-scoped artifact directories
        run: |
          mkdir -p "$POMODOROXII_CI_RESULTS_DIR"
          mkdir -p "$POMODOROXII_TEST_ARTIFACTS_ROOT"
          uv run python -c "import logging; from app.logging import close_structured_logging, setup_logging; setup_logging(); logging.getLogger('pomodoroxii.ci').info('backend CI test run started'); close_structured_logging()"

      - name: Run backend tests with evidence
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          uv run pytest tests/ \
            --no-header \
            -q \
            --tb=short \
            --maxfail=10 \
            -p no:cacheprovider \
            --junitxml=$POMODOROXII_CI_RESULTS_DIR/junit.xml \
            --cov=app \
            --cov-branch \
            --cov-report=xml:$POMODOROXII_CI_RESULTS_DIR/coverage.xml \
            --cov-report=term \
            2>&1 | tee $POMODOROXII_CI_RESULTS_DIR/pytest.log

      - name: Verify backend test evidence
        if: always()
        run: uv run python scripts/ci/verify_test_artifacts.py "$POMODOROXII_CI_RESULTS_DIR"

      - name: Upload backend test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-test-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.POMODOROXII_CI_RESULTS_DIR }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload failed test sandboxes
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-failed-sandboxes-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.POMODOROXII_TEST_ARTIFACTS_ROOT }}
          if-no-files-found: warn
          retention-days: 7

      - name: Clean successful run artifacts
        if: success()
        run: rm -rf -- "$POMODOROXII_CI_RUN_ROOT"
