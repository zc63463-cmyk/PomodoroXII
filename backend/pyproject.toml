[project]
name = "pomodoroxii-backend"
version = "0.1.0"
description = "PomodoroXII backend — FastAPI + SQLAlchemy 2.0 async multi-space rewrite"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "bcrypt>=4.2",
    "python-multipart>=0.0.20",
    "filelock>=3.16",
    "portalocker>=3.1,<4",
    "nanoid>=2.0.0",
    "python-slugify>=8.0.4",
    "fastmcp>=3.0",
    "rfc8785==0.1.4",
    "prometheus-client>=0.22",
]

[project.optional-dependencies]
dev = [
    "cibuildwheel==3.2.1",
    "cmake==4.1.0",
    "ninja==1.13.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    # ★ 门禁可执行性：全量 2970 个用例串行跑要 1-3 小时（实测 13 分钟只推进
    #   约 55 个），等于没有门禁。xdist 把实测耗时压到 ~33 分钟；
    #   timeout 让挂起的用例失败而不是把整条 CI 拖死。
    "pytest-xdist>=3.8",
    "pytest-timeout>=2.4",
    "httpx>=0.28",
    "ruff>=0.8",
    "scikit-build-core==0.11.6",
]

[build-system]
requires = [
    "scikit-build-core==0.11.6",
    "cmake==4.1.0",
    "ninja==1.13.0",
]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
cmake.version = ">=4.1,<4.2"
cmake.build-type = "Release"
wheel.packages = ["app"]
sdist.include = [
    "CMakeLists.txt",
    "cmake/pxii-vfs-source.sha256",
    "native/pxii_vfs/pxii_vfs.c",
    "native/pxii_vfs/pxii_vfs.h",
    "native/vendor/sqlite3ext.h",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
# ★ 挂起保护：单例超过 5 分钟即判失败，避免整条 CI 被一个卡死的用例拖住。
#   Windows 没有 SIGALRM，必须显式用 thread 方式。
timeout = 300
timeout_method = "thread"
# ★ 并行分片按**文件**切（loadfile），不要用默认的 load ——
#   本项目的测试大量依赖模块级 fixture（建库 + 跑迁移），
#   同一文件的用例共享这些 fixture，拆到不同 worker 会重复建库并放大 I/O 争抢。
#
#   用法（`--dist`/`-n` 是命令行选项，**不能**写进 ini_options，
#   写在这里 pytest 会告警 "Unknown config option"）：
#       pytest -n 8 --dist loadfile
#   -n 不写进 addopts：单文件调试时不该拉起 8 个 worker。

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# F: pyflakes (unused imports, undefined names — real bugs)
# E: pycodestyle errors
# W: pycodestyle warnings
# I: isort (import ordering)
select = ["F", "E", "W", "I"]
# Ignore style nits that the codebase already doesn't follow:
# E501: line too long (we set line-length=100 but some docstrings exceed it)
# E722: bare except (used in a few places for broad error capture)
# E402: module-level import not at top (some tests import inside functions)
ignore = ["E501", "E722", "E402"]

[tool.ruff.lint.per-file-ignores]
# Tests may use broader exception handling and star imports for fixtures.
"tests/**" = ["E402", "F401", "F811"]
# These frozen migrations predate the repository's Ruff import-order policy.
"alembic/versions/001_initial.py" = ["I001"]
"alembic/versions/002_sync_indexes.py" = ["I001"]
"alembic/versions/003_note_status_check.py" = ["I001"]
"alembic/versions/004_task_indexes.py" = ["I001"]
"alembic/versions/005_sync_updated_at_indexes.py" = ["I001"]
"alembic/versions/006_sync_timestamp_normalize.py" = ["I001"]
"alembic/versions/cab2ff7bcf37_phase_b_all_models.py" = ["I001"]

[tool.ruff.lint.isort]
# Keep import classification stable whether Ruff runs from Windows or Linux.
known-first-party = ["app", "tests"]
known-third-party = ["alembic"]
