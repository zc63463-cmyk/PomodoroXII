[project]
name = "pomodoroxii-backend"
version = "0.1.0"
description = "PomodoroXII backend — FastAPI + SQLAlchemy 2.0 async multi-space rewrite"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "bcrypt>=4.2",
    "python-multipart>=0.0.20",
    "filelock>=3.16",
    "portalocker>=3.1,<4",
    "nanoid>=2.0.0",
    "python-slugify>=8.0.4",
    "fastmcp>=3.0",
    "rfc8785==0.1.4",
]

[project.optional-dependencies]
dev = [
    "cibuildwheel==3.2.1",
    "cmake==4.1.0",
    "ninja==1.13.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "scikit-build-core==0.11.6",
]

[build-system]
requires = [
    "scikit-build-core==0.11.6",
    "cmake==4.1.0",
    "ninja==1.13.0",
]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
cmake.version = ">=4.1,<4.2"
cmake.build-type = "Release"
wheel.packages = ["app"]
sdist.include = [
    "CMakeLists.txt",
    "cmake/pxii-vfs-source.sha256",
    "native/pxii_vfs/pxii_vfs.c",
    "native/pxii_vfs/pxii_vfs.h",
    "native/vendor/sqlite3ext.h",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# F: pyflakes (unused imports, undefined names — real bugs)
# E: pycodestyle errors
# W: pycodestyle warnings
# I: isort (import ordering)
select = ["F", "E", "W", "I"]
# Ignore style nits that the codebase already doesn't follow:
# E501: line too long (we set line-length=100 but some docstrings exceed it)
# E722: bare except (used in a few places for broad error capture)
# E402: module-level import not at top (some tests import inside functions)
ignore = ["E501", "E722", "E402"]

[tool.ruff.lint.per-file-ignores]
# Tests may use broader exception handling and star imports for fixtures.
"tests/**" = ["E402", "F401", "F811"]

[tool.ruff.lint.isort]
# Keep import classification stable whether Ruff runs from Windows or Linux.
known-first-party = ["app", "tests"]
known-third-party = ["alembic"]
